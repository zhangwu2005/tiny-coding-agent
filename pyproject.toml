[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-coding-agent"
version = "0.2.0"
description = "A small OpenAI-compatible coding agent implemented without an agent framework"
requires-python = ">=3.10"

[project.scripts]
coding-agent = "coding_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
